<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Fichada</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14171A">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14171A;--steel:#222822;--steel2:#2C332C;
  --paper:#ECE8DE;--dim:#A9A89F;
  --hivis:#F5C518;--hivis-d:#8a7615;
  --moss:#7FA37E;--rust:#C75A45;
  --line:rgba(236,232,222,0.10);--r:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--paper);font-family:'Inter',sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent;}
.app{max-width:520px;margin:0 auto;padding:18px 16px 60px;}

/* topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.topbar h1{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;letter-spacing:.06em;}
.topbar h1 span{color:var(--hivis);}
#btn-cfg{width:38px;height:38px;border-radius:10px;background:var(--steel);border:1px solid var(--line);color:var(--dim);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

/* entrada / salida */
.punch-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.punch-btn{padding:22px 10px;border-radius:var(--r);border:none;font-family:'Oswald',sans-serif;font-size:18px;font-weight:600;letter-spacing:.05em;cursor:pointer;transition:all .2s;}
#btn-entrada{background:var(--steel);color:var(--paper);}
#btn-entrada.active{background:var(--moss);color:#0e1a0e;box-shadow:0 0 18px rgba(127,163,126,.4);}
#btn-salida{background:var(--steel);color:var(--paper);}
#btn-salida.ready{background:var(--rust);color:#fff;box-shadow:0 0 18px rgba(199,90,69,.35);}
.punch-btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;}

/* timer */
.timer-row{text-align:center;margin-bottom:20px;}
#timer-display{font-family:'IBM Plex Mono',monospace;font-size:32px;font-weight:600;color:var(--hivis);letter-spacing:.04em;}
#timer-sub{font-size:11px;color:var(--dim);font-family:'IBM Plex Mono',monospace;margin-top:4px;}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px;}
.stat-card{background:var(--steel);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px;}
.stat-label{font-size:10px;letter-spacing:.1em;color:var(--dim);font-family:'Oswald',sans-serif;display:block;margin-bottom:4px;}
.stat-money{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;display:block;}
.stat-hours{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);display:block;margin-top:2px;}

/* tabs */
.tabs{display:flex;gap:6px;margin-bottom:14px;}
.tab{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--dim);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
.tab.on{background:var(--steel2);color:var(--hivis);border-color:var(--hivis-d);}
.view{display:none;}.view.on{display:block;}

/* botones add */
.btn-add{width:100%;padding:10px;margin-bottom:10px;background:transparent;border:1px dashed var(--line);border-radius:10px;color:var(--dim);font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;}
.btn-add:hover{border-color:var(--hivis-d);color:var(--paper);}
.btn-excel{width:100%;padding:10px;margin-bottom:14px;background:transparent;border:1px solid var(--moss);border-radius:10px;color:var(--moss);font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}

/* form inline */
.iform{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;background:var(--steel);border:1px solid var(--line);border-radius:var(--r);padding:12px;}
.iform label{font-size:11px;color:var(--dim);display:block;margin-bottom:3px;}
.ifield{flex:1;min-width:90px;}
.iform input{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--paper);font-family:'IBM Plex Mono',monospace;font-size:13px;}
.iform .ibtn{width:100%;padding:9px;border-radius:8px;border:none;background:var(--hivis);color:#1a1a14;font-weight:700;font-family:'Inter',sans-serif;font-size:13px;cursor:pointer;margin-top:4px;}

/* neto */
.net-bar{padding:12px;background:var(--steel2);border-radius:var(--r);border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.03em;}
.net-bar .amt{font-family:'IBM Plex Mono',monospace;font-size:16px;}

/* lista */
.ledger{list-style:none;}
.ledger li{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);gap:8px;}
.ledger li:last-child{border-bottom:none;}
.led-main{display:flex;flex-direction:column;gap:2px;flex:1;}
.led-date{font-size:11px;color:var(--dim);font-family:'IBM Plex Mono',monospace;}
.led-desc{font-size:13px;}
.led-amt{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;white-space:nowrap;}
.pos{color:var(--moss);}.neg{color:var(--rust);}
.del-btn{background:none;border:none;color:var(--dim);font-size:15px;cursor:pointer;padding:4px 6px;}
.del-btn:hover{color:var(--rust);}
.empty{color:var(--dim);font-size:13px;padding:14px 2px;text-align:center;}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,12,10,.75);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
.modal[hidden]{display:none;}
.mcard{background:var(--steel);border:1px solid var(--line);border-radius:var(--r);padding:20px;width:100%;max-width:360px;}
.mcard h2{font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:.04em;margin-bottom:14px;}
.mcard label{font-size:11px;color:var(--dim);display:block;margin:10px 0 4px;}
.mcard input{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--paper);font-family:'IBM Plex Mono',monospace;font-size:14px;}
.mrow{display:flex;gap:8px;margin-top:16px;}
.mrow button{flex:1;padding:10px;border-radius:8px;border:none;font-weight:700;cursor:pointer;font-size:13px;}
.mbtn-cancel{background:transparent;border:1px solid var(--line)!important;color:var(--dim);}
.mbtn-ok{background:var(--hivis);color:#1a1a14;}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0;}
.sec-lbl{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:.1em;color:var(--dim);margin-bottom:8px;display:block;}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--steel2);border:1px solid var(--hivis-d);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:13px;display:flex;gap:10px;align-items:center;z-index:60;white-space:nowrap;}
.toast[hidden]{display:none;}
.toast button{background:none;border:none;color:var(--hivis);font-weight:700;cursor:pointer;}

button:focus-visible,input:focus-visible{outline:2px solid var(--hivis);outline-offset:2px;}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <h1>LA FICHADA<span>.</span></h1>
    <button id="btn-cfg" aria-label="Configuracion">&#9881;</button>
  </header>

  <!-- ENTRADA / SALIDA -->
  <div class="punch-row">
    <button class="punch-btn" id="btn-entrada">ENTRADA</button>
    <button class="punch-btn" id="btn-salida" disabled>SALIDA</button>
  </div>

  <!-- TIMER -->
  <div class="timer-row">
    <div id="timer-display">00:00:00</div>
    <div id="timer-sub">Tarifa: $0 / hora</div>
  </div>

  <!-- STATS -->
  <section class="stats">
    <div class="stat-card">
      <span class="stat-label">HOY</span>
      <span class="stat-money" id="s-hoy-m">$0</span>
      <span class="stat-hours" id="s-hoy-h">0h 0m</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">SEMANA</span>
      <span class="stat-money" id="s-sem-m">$0</span>
      <span class="stat-hours" id="s-sem-h">0h 0m</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">MES</span>
      <span class="stat-money" id="s-mes-m">$0</span>
      <span class="stat-hours" id="s-mes-h">0h 0m</span>
    </div>
  </section>

  <!-- TABS -->
  <nav class="tabs">
    <button class="tab on" data-v="turnos">Turnos</button>
    <button class="tab" data-v="adelantos">Adelantos</button>
    <button class="tab" data-v="feriados">Feriados</button>
  </nav>

  <!-- TURNOS -->
  <section id="view-turnos" class="view on">
    <button class="btn-add" id="btn-manual">+ Agregar turno manual</button>
    <button class="btn-excel" id="btn-excel">&#128202; Reporte Excel del mes</button>
    <ul class="ledger" id="list-turnos"></ul>
  </section>

  <!-- ADELANTOS -->
  <section id="view-adelantos" class="view">
    <div class="iform">
      <div class="ifield" style="flex-basis:100%">
        <label for="adv-m">Monto ($)</label>
        <input id="adv-m" type="number" inputmode="decimal" placeholder="0" min="0">
      </div>
      <div class="ifield" style="flex-basis:100%">
        <label for="adv-n">Nota (opcional)</label>
        <input id="adv-n" type="text" placeholder="Ej: quincena">
      </div>
      <div class="ifield" style="flex-basis:100%">
        <label for="adv-f">Fecha</label>
        <input id="adv-f" type="date">
      </div>
      <button class="ibtn" id="btn-adv" style="flex-basis:100%">Registrar adelanto</button>
    </div>
    <div class="net-bar">
      <span>Neto a cobrar este mes</span>
      <span class="amt" id="neto-mes">$0</span>
    </div>
    <ul class="ledger" id="list-adv"></ul>
  </section>

  <!-- FERIADOS -->
  <section id="view-feriados" class="view">
    <div class="iform">
      <div class="ifield" style="flex-basis:100%">
        <label for="hol-f">Fecha</label>
        <input id="hol-f" type="date">
      </div>
      <div class="ifield" style="flex-basis:100%">
        <label for="hol-n">Nota (opcional)</label>
        <input id="hol-n" type="text" placeholder="Ej: feriado nacional">
      </div>
      <button class="ibtn" id="btn-hol" style="flex-basis:100%">Marcar feriado</button>
    </div>
    <div class="net-bar">
      <span>Feriados este mes</span>
      <span class="amt" id="hol-count">0</span>
    </div>
    <ul class="ledger" id="list-hol"></ul>
  </section>

</div><!-- /app -->

<!-- MODAL CONFIG -->
<div class="modal" id="modal-cfg" hidden>
  <div class="mcard">
    <h2>CONFIGURACION</h2>
    <label for="cfg-tarifa">Tarifa por hora ($)</label>
    <input id="cfg-tarifa" type="number" inputmode="decimal" min="0" placeholder="0">
    <div class="mrow">
      <button class="mbtn-cancel" id="cfg-cancel">Cancelar</button>
      <button class="mbtn-ok"     id="cfg-save">Guardar</button>
    </div>
    <hr class="sep">
    <span class="sec-lbl">COPIA DE SEGURIDAD</span>
    <div class="mrow" style="margin-top:0">
      <button class="mbtn-cancel" id="btn-export">&#11015; Backup</button>
      <button class="mbtn-cancel" id="btn-import-trig">&#11014; Restaurar</button>
    </div>
    <input type="file" id="file-import" accept="application/json" hidden>
    <p style="font-size:11px;color:var(--dim);margin-top:10px;">Restaurar reemplaza todos los datos actuales.</p>
  </div>
</div>

<!-- MODAL TURNO MANUAL -->
<div class="modal" id="modal-manual" hidden>
  <div class="mcard">
    <h2>TURNO MANUAL</h2>
    <label for="mm-f">Fecha</label>
    <input id="mm-f" type="date">
    <label for="mm-ini">Hora entrada</label>
    <input id="mm-ini" type="time">
    <label for="mm-fin">Hora salida</label>
    <input id="mm-fin" type="time">
    <div class="mrow">
      <button class="mbtn-cancel" id="mm-cancel">Cancelar</button>
      <button class="mbtn-ok"     id="mm-save">Guardar</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast" hidden>
  <span id="toast-msg"></span>
  <button id="toast-undo">Deshacer</button>
</div>

<script>
(function() {
'use strict';

var KEY = 'fichada-v3';
var state = { tarifa: 0, turnos: [], adelantos: [], feriados: [] };
var undo = null;
var toastT = null;
var tickT  = null;

/* ── storage ─────────────────────────────────────── */
function load() {
  try {
    var r = localStorage.getItem(KEY);
    if (r) {
      var p = JSON.parse(r);
      state.tarifa    = p.tarifa    || 0;
      state.turnos    = Array.isArray(p.turnos)    ? p.turnos    : [];
      state.adelantos = Array.isArray(p.adelantos) ? p.adelantos : [];
      state.feriados  = Array.isArray(p.feriados)  ? p.feriados  : [];
    }
  } catch(e) {}
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {}
}

/* ── helpers ─────────────────────────────────────── */
function pad(n) { return n < 10 ? '0'+n : ''+n; }
function dkey(d) { var x=new Date(d); return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate()); }
function today() { return dkey(new Date()); }
function weekStart(d) {
  var x=new Date(d); var wd=(x.getDay()+6)%7;
  x.setDate(x.getDate()-wd); x.setHours(0,0,0,0); return x;
}
function sameDay(iso)   { return dkey(iso)===today(); }
function sameWeek(iso)  { return weekStart(iso).getTime()===weekStart(new Date()).getTime(); }
function sameMonth(iso) {
  var a=new Date(iso),b=new Date();
  return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth();
}
function fmtMoney(n) { return '$'+Math.round(n||0).toLocaleString('es-AR'); }
function fmtHM(m)    { return Math.floor(m/60)+'h '+Math.round(m%60)+'m'; }
function fmtClock(ms) {
  var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  return pad(h)+':'+pad(m)+':'+pad(sec);
}
function fmtShort(iso) { return new Date(iso).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'}); }
function fmtTime(iso)  { return new Date(iso).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}); }
function genId()       { return 'id'+Date.now()+'_'+Math.floor(Math.random()*10000); }

/* ── turno activo ────────────────────────────────── */
function turnoAbierto() {
  for (var i=0;i<state.turnos.length;i++) {
    if (!state.turnos[i].fin) return state.turnos[i];
  }
  return null;
}

/* ── botones entrada / salida ────────────────────── */
var btnE = document.getElementById('btn-entrada');
var btnS = document.getElementById('btn-salida');
var disp = document.getElementById('timer-display');
var sub  = document.getElementById('timer-sub');

function refreshButtons() {
  var ta = turnoAbierto();
  if (ta) {
    btnE.classList.add('active');
    btnE.disabled = true;
    btnS.classList.add('ready');
    btnS.disabled = false;
    startTick(ta);
  } else {
    btnE.classList.remove('active');
    btnE.disabled = false;
    btnS.classList.remove('ready');
    btnS.disabled = true;
    if (tickT) { clearInterval(tickT); tickT=null; }
    disp.textContent = '00:00:00';
  }
  sub.textContent = 'Tarifa: '+fmtMoney(state.tarifa)+' / hora';
}

function startTick(turno) {
  if (tickT) clearInterval(tickT);
  tickT = setInterval(function() {
    disp.textContent = fmtClock(Date.now()-new Date(turno.inicio).getTime());
  }, 1000);
  disp.textContent = fmtClock(Date.now()-new Date(turno.inicio).getTime());
}

/* visibilitychange: recalcula el timer cuando vuelve al frente */
document.addEventListener('visibilitychange', function() {
  var ta = turnoAbierto();
  if (document.visibilityState==='visible' && ta) {
    startTick(ta);
  } else if (tickT) {
    clearInterval(tickT); tickT=null;
  }
});

btnE.addEventListener('click', function() {
  if (turnoAbierto()) return;
  state.turnos.push({ id:genId(), inicio:new Date().toISOString(), fin:null, durMin:0, ganancia:0 });
  save(); refreshButtons(); renderAll();
});

btnS.addEventListener('click', function() {
  var ta = turnoAbierto();
  if (!ta) return;
  ta.fin = new Date().toISOString();
  ta.durMin   = (new Date(ta.fin)-new Date(ta.inicio))/60000;
  ta.ganancia = (ta.durMin/60)*state.tarifa;
  save(); refreshButtons(); renderAll();
  toast('Turno cerrado · '+fmtHM(ta.durMin)+' · '+fmtMoney(ta.ganancia), true);
});

/* ── stats ───────────────────────────────────────── */
function calcRange(filterFn) {
  var mins=0, money=0;
  for (var i=0;i<state.turnos.length;i++) {
    var t=state.turnos[i];
    if (!t.fin) continue;
    if (filterFn(t.inicio)) { mins+=t.durMin; money+=t.ganancia; }
  }
  return {mins:mins,money:money};
}

function renderStats() {
  var now = new Date();
  var hoy = calcRange(sameDay);
  var sem = calcRange(sameWeek);
  var mes = calcRange(sameMonth);

  document.getElementById('s-hoy-m').textContent = fmtMoney(hoy.money);
  document.getElementById('s-hoy-h').textContent = fmtHM(hoy.mins);
  document.getElementById('s-sem-m').textContent = fmtMoney(sem.money);
  document.getElementById('s-sem-h').textContent = fmtHM(sem.mins);
  document.getElementById('s-mes-m').textContent = fmtMoney(mes.money);
  document.getElementById('s-mes-h').textContent = fmtHM(mes.mins);

  var advMes = 0;
  for (var j=0;j<state.adelantos.length;j++) {
    if (sameMonth(state.adelantos[j].fecha)) advMes += Number(state.adelantos[j].monto);
  }
  var neto = mes.money - advMes;
  var netoEl = document.getElementById('neto-mes');
  netoEl.textContent = fmtMoney(neto);
  netoEl.style.color = neto<0 ? 'var(--rust)' : 'var(--moss)';

  var holCnt = 0;
  for (var k=0;k<state.feriados.length;k++) {
    if (sameMonth(state.feriados[k].fecha)) holCnt++;
  }
  document.getElementById('hol-count').textContent = holCnt;
}

/* ── listas ──────────────────────────────────────── */
function mkEl(tag,cls,txt) {
  var el=document.createElement(tag);
  if(cls) el.className=cls;
  if(txt!==undefined) el.textContent=txt;
  return el;
}

function delBtn(col, id) {
  var b=mkEl('button','del-btn','\u2715');
  b.setAttribute('aria-label','Eliminar');
  (function(c,i){b.addEventListener('click',function(){delItem(c,i);});})(col,id);
  return b;
}

function emptyRow(ul, msg) {
  var li=mkEl('li'); li.style.display='block';
  li.className='empty'; li.textContent=msg;
  ul.appendChild(li);
}

function renderTurnos() {
  var ul=document.getElementById('list-turnos');
  ul.innerHTML='';
  var sorted=state.turnos.slice().sort(function(a,b){return new Date(b.inicio)-new Date(a.inicio);});
  if (!sorted.length) { emptyRow(ul,'Todavia no hay turnos.'); return; }
  sorted.forEach(function(t) {
    var li=mkEl('li');
    var main=mkEl('div','led-main');
    main.appendChild(mkEl('span','led-date',fmtShort(t.inicio)));
    var desc;
    if (!t.fin) {
      desc = 'En curso...';
    } else {
      desc = fmtTime(t.inicio)+' \u2013 '+fmtTime(t.fin)+' \u00b7 '+fmtHM(t.durMin);
    }
    main.appendChild(mkEl('span','led-desc',desc));
    li.appendChild(main);
    li.appendChild(mkEl('span','led-amt pos', t.fin?fmtMoney(t.ganancia):'\u2014'));
    li.appendChild(delBtn('turnos',t.id));
    ul.appendChild(li);
  });
}

function renderAdelantos() {
  var ul=document.getElementById('list-adv');
  ul.innerHTML='';
  var sorted=state.adelantos.slice().sort(function(a,b){return new Date(b.fecha)-new Date(a.fecha);});
  if (!sorted.length) { emptyRow(ul,'No hay adelantos.'); return; }
  sorted.forEach(function(a) {
    var li=mkEl('li');
    var main=mkEl('div','led-main');
    main.appendChild(mkEl('span','led-date',fmtShort(a.fecha)));
    main.appendChild(mkEl('span','led-desc',a.nota||'Adelanto'));
    li.appendChild(main);
    li.appendChild(mkEl('span','led-amt neg','\u2212'+fmtMoney(a.monto)));
    li.appendChild(delBtn('adelantos',a.id));
    ul.appendChild(li);
  });
}

function renderFeriados() {
  var ul=document.getElementById('list-hol');
  ul.innerHTML='';
  var sorted=state.feriados.slice().sort(function(a,b){return new Date(b.fecha)-new Date(a.fecha);});
  if (!sorted.length) { emptyRow(ul,'No hay feriados.'); return; }
  sorted.forEach(function(f) {
    var li=mkEl('li');
    var main=mkEl('div','led-main');
    main.appendChild(mkEl('span','led-date',fmtShort(f.fecha)));
    main.appendChild(mkEl('span','led-desc',f.nota||'Feriado'));
    li.appendChild(main);
    li.appendChild(delBtn('feriados',f.id));
    ul.appendChild(li);
  });
}

function renderAll() { renderStats(); renderTurnos(); renderAdelantos(); renderFeriados(); }

/* ── eliminar + undo ─────────────────────────────── */
function delItem(col, id) {
  var arr=state[col];
  var idx=-1;
  for (var i=0;i<arr.length;i++) { if(arr[i].id===id){idx=i;break;} }
  if (idx===-1) return;
  var removed=arr.splice(idx,1)[0];
  undo={col:col,item:removed,idx:idx};
  save(); renderAll(); toast('Eliminado',false);
}

/* ── tabs ────────────────────────────────────────── */
var tabBtns=document.querySelectorAll('.tab');
for (var ti=0;ti<tabBtns.length;ti++) {
  (function(btn){
    btn.addEventListener('click',function(){
      for(var i=0;i<tabBtns.length;i++) tabBtns[i].classList.remove('on');
      var views=document.querySelectorAll('.view');
      for(var j=0;j<views.length;j++) views[j].classList.remove('on');
      btn.classList.add('on');
      document.getElementById('view-'+btn.getAttribute('data-v')).classList.add('on');
    });
  })(tabBtns[ti]);
}

/* ── adelantos form ──────────────────────────────── */
document.getElementById('btn-adv').addEventListener('click', function() {
  var m=Number(document.getElementById('adv-m').value);
  if (!m||m<=0) { toast('Ingresa un monto valido',true); return; }
  var n=document.getElementById('adv-n').value;
  var f=document.getElementById('adv-f').value||today();
  state.adelantos.push({id:genId(),fecha:new Date(f+'T12:00:00').toISOString(),monto:m,nota:n});
  save();
  document.getElementById('adv-m').value='';
  document.getElementById('adv-n').value='';
  renderAll();
});

/* ── feriados form ───────────────────────────────── */
document.getElementById('btn-hol').addEventListener('click', function() {
  var f=document.getElementById('hol-f').value;
  if (!f) { toast('Selecciona una fecha',true); return; }
  var n=document.getElementById('hol-n').value;
  state.feriados.push({id:genId(),fecha:new Date(f+'T12:00:00').toISOString(),nota:n});
  save();
  document.getElementById('hol-f').value='';
  document.getElementById('hol-n').value='';
  renderAll();
});

/* ── modal config ────────────────────────────────── */
var mCfg=document.getElementById('modal-cfg');
document.getElementById('btn-cfg').addEventListener('click',function(){
  document.getElementById('cfg-tarifa').value=state.tarifa||'';
  mCfg.hidden=false;
});
document.getElementById('cfg-cancel').addEventListener('click',function(){mCfg.hidden=true;});
document.getElementById('cfg-save').addEventListener('click',function(){
  state.tarifa=Number(document.getElementById('cfg-tarifa').value)||0;
  save(); mCfg.hidden=true; refreshButtons(); renderAll();
});

/* ── backup ──────────────────────────────────────── */
document.getElementById('btn-export').addEventListener('click',function(){
  try {
    var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download='fichada-backup-'+today()+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url); toast('Backup descargado',true);
  } catch(e){toast('Error al exportar',true);}
});
var fImport=document.getElementById('file-import');
document.getElementById('btn-import-trig').addEventListener('click',function(){fImport.click();});
fImport.addEventListener('change',function(e){
  var file=e.target.files[0]; if(!file) return;
  var r=new FileReader();
  r.onload=function(ev){
    try {
      var p=JSON.parse(ev.target.result);
      if (!p||!Array.isArray(p.turnos)) throw new Error();
      state={tarifa:p.tarifa||0,turnos:p.turnos,adelantos:p.adelantos||[],feriados:p.feriados||[]};
      save(); mCfg.hidden=true; refreshButtons(); renderAll();
      toast('Backup restaurado',true);
    } catch(err){toast('Archivo invalido',true);}
  };
  r.readAsText(file); fImport.value='';
});

/* ── turno manual ────────────────────────────────── */
var mManual=document.getElementById('modal-manual');
document.getElementById('btn-manual').addEventListener('click',function(){
  document.getElementById('mm-f').value=today();
  document.getElementById('mm-ini').value='';
  document.getElementById('mm-fin').value='';
  mManual.hidden=false;
});
document.getElementById('mm-cancel').addEventListener('click',function(){mManual.hidden=true;});
document.getElementById('mm-save').addEventListener('click',function(){
  var f=document.getElementById('mm-f').value;
  var hi=document.getElementById('mm-ini').value;
  var hf=document.getElementById('mm-fin').value;
  if (!f||!hi||!hf){toast('Completa todos los campos',true);return;}
  var ini=new Date(f+'T'+hi+':00');
  var fin=new Date(f+'T'+hf+':00');
  if (fin<=ini){toast('La salida debe ser posterior a la entrada',true);return;}
  var dur=(fin-ini)/60000;
  state.turnos.push({id:genId(),inicio:ini.toISOString(),fin:fin.toISOString(),durMin:dur,ganancia:(dur/60)*state.tarifa});
  save(); mManual.hidden=true; renderAll();
});

/* ── Excel ───────────────────────────────────────── */
document.getElementById('btn-excel').addEventListener('click',function(){
  if (typeof XLSX==='undefined'){toast('Libreria no cargada, revisa internet',true);return;}
  var now=new Date();
  var mes=now.toLocaleDateString('es-AR',{month:'long',year:'numeric'});
  var fname='fichada-'+now.getFullYear()+'-'+pad(now.getMonth()+1)+'.xlsx';

  /* turnos del mes */
  var tmes=state.turnos.filter(function(t){return t.fin&&sameMonth(t.inicio);});
  tmes.sort(function(a,b){return new Date(a.inicio)-new Date(b.inicio);});
  var totMins=0,totGan=0;
  var wsTurnos=[['Fecha','Entrada','Salida','Duracion (min)','Horas','Ganancia ($)']];
  tmes.forEach(function(t){
    totMins+=t.durMin; totGan+=t.ganancia;
    wsTurnos.push([
      fmtShort(t.inicio), fmtTime(t.inicio), fmtTime(t.fin),
      Math.round(t.durMin), parseFloat((t.durMin/60).toFixed(2)), Math.round(t.ganancia)
    ]);
  });
  wsTurnos.push([]); wsTurnos.push(['TOTAL','','',Math.round(totMins),parseFloat((totMins/60).toFixed(2)),Math.round(totGan)]);

  /* adelantos del mes */
  var ames=state.adelantos.filter(function(a){return sameMonth(a.fecha);});
  var totAdv=ames.reduce(function(s,a){return s+Number(a.monto);},0);
  var wsAdv=[['Fecha','Nota','Monto ($)']];
  ames.forEach(function(a){wsAdv.push([fmtShort(a.fecha),a.nota||'-',Math.round(a.monto)]);});
  wsAdv.push([]); wsAdv.push(['TOTAL','',Math.round(totAdv)]);

  /* feriados del mes */
  var fmes=state.feriados.filter(function(f){return sameMonth(f.fecha);});
  var wsHol=[['Fecha','Nota']];
  fmes.forEach(function(f){wsHol.push([fmtShort(f.fecha),f.nota||'-']);});

  /* resumen */
  var neto=Math.round(totGan-totAdv);
  var wsRes=[
    ['Resumen del mes',''],['',''],
    ['Mes',mes],
    ['Turnos',tmes.length],
    ['Total horas',parseFloat((totMins/60).toFixed(2))],
    ['Tarifa ($/h)',state.tarifa],['',''],
    ['Ganancia bruta ($)',Math.round(totGan)],
    ['Adelantos ($)',Math.round(totAdv)],
    ['Neto a cobrar ($)',neto],['',''],
    ['Feriados',fmes.length]
  ];

  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(wsRes),'Resumen');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(wsTurnos),'Turnos');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(wsAdv),'Adelantos');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(wsHol),'Feriados');
  XLSX.writeFile(wb,fname);
  toast('Excel descargado',true);
});

/* ── toast ───────────────────────────────────────── */
function toast(msg,hideUndo){
  var el=document.getElementById('toast');
  document.getElementById('toast-msg').textContent=msg;
  document.getElementById('toast-undo').style.display=hideUndo?'none':'';
  el.hidden=false;
  clearTimeout(toastT);
  toastT=setTimeout(function(){el.hidden=true;undo=null;},4000);
}
document.getElementById('toast-undo').addEventListener('click',function(){
  if(undo){state[undo.col].splice(undo.idx,0,undo.item);save();renderAll();}
  document.getElementById('toast').hidden=true;undo=null;
});

/* ── service worker ──────────────────────────────── */
if ('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}

/* ── init ────────────────────────────────────────── */
load();
document.getElementById('adv-f').value=today();
refreshButtons();
renderAll();
if (!state.tarifa) { mCfg.hidden=false; }

})();
</script>
